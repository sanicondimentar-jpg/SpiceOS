<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión — SpiceOS</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fcfbfa; color: #1f1a17; padding: 24px; box-sizing: border-box; }
  main { max-width: 320px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #6b625c; font-size: 15px; line-height: 1.4; }
  button { margin-top: 16px; background: #ca3a1b; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Sin conexión</h1>
  <p>SpiceOS necesita internet para mostrar los datos al día. Revisá el wifi o los datos del celular.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
