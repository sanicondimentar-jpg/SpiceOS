name: spiceos

x-app-env: &app-env
  env_file: ../../.env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--features=organization"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["8080:8080"]
    volumes:
      - ../keycloak/realm-spiceos.json:/opt/keycloak/data/import/realm-spiceos.json:ro
    depends_on:
      postgres: { condition: service_healthy }

  # --- Observabilidad ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes: [../observability/otel-collector.yaml:/etc/otel/config.yaml:ro]
    ports: ["4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes: [../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.3.2
    ports: ["3100:3100"]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [../observability/tempo.yaml:/etc/tempo.yaml:ro]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: [../observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro]
    ports: ["3001:3000"]

  # --- Aplicación (perfil "app"; en desarrollo se corre con pnpm dev) ---
  api:
    <<: *app-env
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/main.js"]
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  worker:
    <<: *app-env
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    depends_on:
      rabbitmq: { condition: service_healthy }

  scheduler:
    <<: *app-env
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "dist/scheduler.js"]
    deploy: { replicas: 1 } # una sola réplica: dispara reglas por horario
    depends_on:
      rabbitmq: { condition: service_healthy }

  web:
    <<: *app-env
    profiles: ["app"]
    build: { context: ../.., dockerfile: infra/docker/web.Dockerfile }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pg-data:
  redis-data:
  rabbit-data:
  qdrant-data:
  minio-data:
