#cloud-config
# Se pega en "Cloud config" al crear el servidor (Ubuntu 24.04). Instala Docker,
# deja abiertos solo SSH, HTTP y HTTPS, agrega 2 GB de swap y activa las actualizaciones de seguridad.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, ufw, unattended-upgrades, rsync]
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443
  - ufw --force enable
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - mkdir -p /opt/spiceos
