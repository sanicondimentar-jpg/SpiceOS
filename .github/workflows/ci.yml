name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: spiceos
          POSTGRES_PASSWORD: spiceos
          POSTGRES_DB: spiceos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spiceos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://spiceos:spiceos@localhost:5432/spiceos
      MIGRATION_DATABASE_URL: postgresql://spiceos:spiceos@localhost:5432/spiceos
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spiceos/contracts build
      - run: pnpm --filter @spiceos/api exec prisma generate
      - name: Migraciones (incluye políticas RLS)
        run: pnpm --filter @spiceos/api exec prisma migrate deploy
      - run: pnpm --filter @spiceos/api typecheck
      - run: pnpm --filter @spiceos/api test
      - run: pnpm --filter @spiceos/api build
      - run: pnpm --filter @spiceos/web build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  images:
    needs: build-test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      # ghcr exige nombres en minúscula y el repo se llama SpiceOS.
      - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # En los PR solo se construyen las imágenes; se publican al llegar a main.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
      # Etapa de build de la API (prisma CLI, ts-node): la usa el despliegue para migraciones y datos iniciales.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          target: build
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/api-tools:${{ github.sha }}
